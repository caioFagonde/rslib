[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "rslib"
version = "0.1.0"
description = "Cloud-native Earth observation analysis, with a shared browser and terminal workbench"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "numpy>=2,<3",
  "rasterio>=1.4,<2",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "Pillow>=11,<13",
  "scipy>=1.14,<2",
  "typer>=0.15,<1",
  "rich>=13,<15",
  "textual>=1,<9",
  "jinja2>=3.1.6,<4",
  "shapely>=2.1,<3",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.5,<2"]
deep = ["torch>=2.6,<3"]
sr = ["torch>=2.6,<3", "sen2sr==0.8.5", "safetensors>=0.5.2,<1"]
cube = ["odc-stac>=0.4,<1", "xarray>=2025.1", "dask[array]>=2025.1"]
postgis = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.11,<1"]

[project.scripts]
rslib = "rslib.cli:app"

[tool.hatch.build]
artifacts = ["src/rslib/web/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/rslib"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[dependency-groups]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6,<10",
]
